<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokemons</title>
  <link rel="stylesheet" href="../pokemon.css">
  <link rel="stylesheet" href="../Pokecard.css">
  <script src = "pokemon.js" defer ></script>
</head>
<body class = "pokemonsBody">
<header>
  <H1>Pokévanta</H1>
</header>

<div class = "pokeBoksStor">
<section class ="pokemonSøg">
  <h2>Søg efter Pokemons</h2>
  <label for="search">pokemon navn:</label>

  <input type="text" id = "search" placeholder="søg efter pokemon">
</section>

<section class ="filter">
  <h2>Filter af Pokemons</h2>
  <label for="typeFilter">Filter:</label>

  <select id="typeFilter">
    <option value="all">Alle typer</option>
    <option value="Water">Water</option>
    <option value="Grass">Grass</option>
    <option value="Electric">Electric</option>
    <option value="Normal">Normal</option>
  </select>
</section>

<section class="sortering">
  <h2>sortering af pokemons</h2>
  <label for="sortering">Sortering af pokemons:</label>

  <select id="sortering">
    <option value="pokedex">Pokedex nr</option>
    <option value="hp">hp</option>
    <option value="navn">navn</option>
    <option value="speed">speed
    <option value="attack">attack</option>
    <option value="defense">defense</option>
  </select>
</section>

</div>

<section class="pokemonResultater">
  <h2>Alle Pokémon</h2>

  <article id="pokemonContainer">
    <!-- Pokémon indsætteds her med js -->
  </article>
</section>


</body>
</html>
