<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokemons</title>
  <link rel="stylesheet" href="../pokemon.css">
  <link rel="stylesheet" href="../rarity.css">
  <link rel="stylesheet" href="../Pokecard.css">
  <script src = "../pokemon.js" defer ></script>
</head>
<body class = "pokemonsBody">
<header>
  <H1>Pokeview</H1>
  <h2>Pokemons</h2>
</header>

<div class = "pokeBoksStor">
<section class ="pokemonSøg">
  <h2>Søg efter Pokemons</h2>
  <label for="search">pokemon navn:</label>

  <input type="text" id = "search" placeholder="søg efter pokemon">
</section>

<section class ="filter">
  <h2>Filter af Pokemons</h2>
  <label for="typeFilter">Filter:</label>

  <select id="typeFilter">
    <option value="all">Alle typer</option>
    <option value="Water">Water</option>
    <option value="Grass">Grass</option>
    <option value="Electric">Electric</option>
    <option value="Normal">Normal</option>
  </select>
</section>

<section class="sortering">
  <h2>sortering af pokemons</h2>
  <label for="sortering">Sortering af pokemons:</label>

  <select id="sortering">
    <option value="pokedex_number">Pokedex nr</option>
    <option value="hp">hp</option>
    <option value="name">navn</option>
    <option value="speed">speed</option>
    <option value="attack">attack</option>
    <option value="defense">defense</option>
  </select>

  <label for="sortOrder">Rækkefølge:</label>

  <select id="sortOrder">
    <option value="ASC">Laveste først (A-Å)</option>
    <option value="DESC">Højeste først (Å-A)</option>
  </select>
</section>
</div>

<section class="pokemonResultater">

  <div class="rarity-header">

  <h2>Alle Pokémon</h2>

<ul class="rarity-guide">

    <li class="rarity-item rarity-common">
      <img src="../img/rarity/rarity-1.svg">
      <div>
        <strong>Common</strong>
        <small>Under 400 stats</small>
      </div>
    </li>

  <li class="rarity-item rarity-uncommon">
    <img src="../img/rarity/rarity-2.svg">
    <div>
      <strong>Uncommon</strong>
      <small>400–499 stats</small>
    </div>
  </li>

  <li class="rarity-item rarity-rare">
    <img src="../img/rarity/rarity-3.svg">
    <div>
      <strong>Rare</strong>
      <small>500+ stats</small>
    </div>
  </li>

  <li class="rarity-item rarity-legendary">
    <img src="../img/rarity/rarity-4.svg">
    <div>
      <strong>Legendarisk</strong>
      <small>Legendarisk Pokémon</small>
    </div>
  </li>

  <li class="rarity-item rarity-mythical">
    <img src="../img/rarity/rarity-5.svg">
    <div>
      <strong>Mythical</strong>
      <small>Mystisk Pokémon</small>
    </div>
  </li>

</ul>

  </div>

  <article id="pokemonContainer">
    <!-- Pokémon indsætteds her med js -->
  </article>
</section>


</body>
</html>
