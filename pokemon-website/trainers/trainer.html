<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Træner</title>
  <link rel="stylesheet" href="../pokemon.css">
  <link rel="stylesheet" href="../Pokecard.css">
  <link rel="stylesheet" href="../trainer-images.css">
  <link rel="stylesheet" href="../rarity.css">
  <link rel="stylesheet" href="trainers-dashboard.css">
  <script src="../træner.js" defer></script>
</head>
<body class = "pokemonsBody">
<header>
  <H1>Pokeview</H1>
  <h2>Træner</h2>
</header>

<div class="pokeBoksStor">
  <section class="opretTræner">
    <h2>Opret en træner</h2>
    <label for="trænerNavn">Træner navn:</label>

    <div class = "trænerInput">
      <input type="text" id = "trænerNavn" placeholder="Skriv et navn">
      <input type="text" id="homeTown" placeholder="Skriv hjemby">
      <input type="number" id="trainerAge" placeholder="Skriv alder">

      <button type="button" id ="opretTræner">Opret</button>
    </div>

    <div class="forbindTræner">
      <label for="trænerPokemonForbind">Forbind din træner</label>
      <select id="trænerPokemonForbind">
        <option value="1">Bulbasaur</option>
        <option value="4">Charmander</option>
        <option value="7">Squirtle</option>
        <option value="25">Pikachu</option>
      </select>
    </div>

    <p id="besked"></p>

  </section>


  <section class ="filterTræner">
    <h2>Filter af Træner</h2>
    <label for="typeFilterTræner">Filter:</label>

    <select id="typeFilterTræner">
      <option value="all">Alle typer</option>
      <option value="1"">Begynder</option>
      <option value="6">Goat</option>
      <option value="7">Gym Leaders</option>
    </select>
  </section>

  <section class="sortering">
    <h2>sortering af Trænere</h2>
    <label for="sorteringTrænere">Sortering af trænere:</label>

    <select id="sorteringTrænere">
      <option value="trænerId">Træner Id</option>
      <option value="navn">Navn</option>
      <option value="by">By</option>
      <option value="antalBadges">Antal Badges</option>
      <option value="alder">Alder</option>
    </select>

    <label for="sortOrder">Rækkefølge:</label>

    <select id="sortOrder">
      <option value="ASC">Laveste først (A-Å)</option>
      <option value="DESC">Højeste først (Å-A)</option>
    </select>
  </section>
</div>

<section class="trænerResultater">

  <div class="trainer-header">


  <h2>Alle Trænere</h2>

  <ul class ="trainer-emblem-guide">
  <li class="trainer-emblem-item trainer-emblem-begynder">
    <img src="../img/trainerbadges/level-1.svg" alt="trainerlvlbadge1">
         <div>
           <strong>Begynder</strong>
           <small>0 Badges</small>
         </div>
  </li>

      <li class="trainer-emblem-item trainer-emblem-goat">
        <img src="../img/trainerbadges/level-6.svg" alt="trainerlvlbadge6">
        <div>
          <strong>Goat</strong>
          <small>8+ Badges</small>
        </div>
      </li>
    <li class="trainer-emblem-item trainer-emblem-gym">
      <img src="../img/trainerbadges/level-7.svg" alt="trainerlvlbadge7">
      <div>
        <strong>Gym Leader</strong>
        <small>Leder et gym</small>
      </div>
    </li>
  </ul>
  </div>

  <article id="trainerContainer">
    <!-- trænere indsætteds her med js -->
  </article>
</section>


</body>
</html>
